name: CodeQL SAST Scan

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL - ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: juice-shop
            repo: juice-shop/juice-shop
            language: javascript-typescript
          - name: webgoat
            repo: WebGoat/WebGoat
            language: java-kotlin
          - name: nodegoat
            repo: OWASP/NodeGoat
            language: javascript-typescript
          - name: pygoat
            repo: adeyosemanputra/pygoat
            language: python
          - name: vulnshop
            repo: nr-yolo/Vulnshop
            language: javascript
          - name: iwa-java
            repo: fortify/IWA-Java
            language: java-kotlin
          - name: vulnerable-java-app
            repo: siddharthoak/vulnerable-java-app
            language: java-kotlin
          - name: vulnbookstore
            repo: tobiasbruss/vulnerable-repo
            language: python
          - name: vulnerable-graphql
            repo: dolevf/Damn-Vulnerable-GraphQL-Application
            language: javascript-typescript
          - name: railsgoat
            repo: OWASP/railsgoat
            language: ruby

    steps:
      # 1. Клонируем репозиторий БЕЗ path, чтобы код оказался в корне $GITHUB_WORKSPACE
      - name: Checkout ${{ matrix.project.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          fetch-depth: 1

      # 2. Инициализация CodeQL. Для всех используем autobuild — самый надежный режим
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      # 3. Анализ. continue-on-error не даст упасть всему пайплайну из-за одного проекта
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}/project:${{ matrix.project.name }}"
          output: codeql-results-${{ matrix.project.name }}
          upload: false

      # 4. Подготовка JSON-отчетов (SARIF уже является JSON)
      - name: Prepare JSON Reports
        if: always() # Выполняется даже если анализ упал
        run: |
          mkdir -p final-json-reports
          # Ищем SARIF файлы и переименовываем их в .json
          find codeql-results-${{ matrix.project.name }} -name "*.sarif" -exec cp {} final-json-reports/${{ matrix.project.name }}-codeql.json \; || true
          # Если файлов нет, создаем пустой JSON, чтобы шаг загрузки не упал
          if [ ! -f final-json-reports/${{ matrix.project.name }}-codeql.json ]; then
            echo '{"runs": [], "version": "2.1.0"}' > final-json-reports/${{ matrix.project.name }}-codeql.json
          fi

      # 5. Загрузка артефактов
      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-json-${{ matrix.project.name }}
          path: final-json-reports/*.json
          retention-days: 30
