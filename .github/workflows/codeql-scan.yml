name: CodeQL SAST Matrix Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Scan - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - bwapp
          - dvna
          - dvwa
          - juice-shop
          - nodegoat
          - railsgoat
          - vulnerable-flask-app
          - webgoat
          - xvwa

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python, ruby, java-kotlin
          build-mode: none
          paths: repos/${{ matrix.project }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.project }}"
          output: codeql-results

      - name: Generate CSV Report
        if: always()
        run: |
          SARIF_FILE=$(find codeql-results -name "*.sarif" -type f | head -n 1)
          echo "project,rule_id,severity,file,line,message" > codeql-${{ matrix.project }}.csv
          
          if [ -f "$SARIF_FILE" ]; then
            # Ищем level в самом результате, либо в настройках правила по умолчанию
            jq -r --arg project "${{ matrix.project }}" '
              .runs[] as $run |
              $run.results[]? |
              . as $result |
              ($run.rules[]? | select(.id == $result.ruleId)) as $rule |
              [
                $project,
                $result.ruleId,
                (($result.level // $rule.defaultConfiguration.level // "N/A") | tostring | ascii_upcase),
                ($result.locations[0].physicalLocation.artifactLocation.uri // "N/A"),
                ($result.locations[0].physicalLocation.region.startLine // 0),
                ($result.message.text // "" | gsub("\n"; " "))
              ] | @csv
            ' "$SARIF_FILE" >> codeql-${{ matrix.project }}.csv
            
            echo "--- Первые 5 строк отчета ---"
            head -n 5 codeql-${{ matrix.project }}.csv
          fi

      - name: Upload CodeQL SARIF & CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.project }}
          path: |
            codeql-results/*.sarif
            codeql-${{ matrix.project }}.csv
          if-no-files-found: warn
          retention-days: 30
