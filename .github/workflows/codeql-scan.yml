name: "CodeQL Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python', 'java' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        output: sarif-results

    - name: Convert SARIF to JSON
      run: |
        # Установить jq для обработки JSON
        sudo apt-get install -y jq
        
        # Конвертировать SARIF в JSON
        for file in sarif-results/*.sarif; do
          if [ -f "$file" ]; then
            filename=$(basename "$file" .sarif)
            cat "$file" | jq '.' > "${filename}.json"
            echo "Created ${filename}.json"
          fi
        done

    - name: Upload JSON artifacts
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results-${{ matrix.language }}
        path: |
          *.json
          *.sarif
        retention-days: 30
