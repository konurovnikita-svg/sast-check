
name: CodeQL External Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OWASP Juice Shop
            repository: juice-shop/juice-shop
            language: javascript-typescript

          - name: DVWA
            repository: digininja/DVWA
            language: php

          - name: OWASP WebGoat
            repository: WebGoat/WebGoat
            language: java-kotlin

          - name: OWASP NodeGoat
            repository: OWASP/NodeGoat
            language: javascript-typescript

          - name: PyGoat
            repository: pygoat/pygoat
            language: python

          # Verify the repository owners and names below.
          - name: VulnShop
            repository: REPLACE_WITH_OWNER/VulnShop
            language: javascript-typescript

          - name: IWA-Java
            repository: REPLACE_WITH_OWNER/IWA-Java
            language: java-kotlin

          - name: vulnerable-java-app
            repository: REPLACE_WITH_OWNER/vulnerable-java-app
            language: java-kotlin

          - name: VulnBookStore
            repository: REPLACE_WITH_OWNER/VulnBookStore
            language: java-kotlin

          - name: Damn Vulnerable GraphQL Application
            repository: dolevf/Damn-Vulnerable-GraphQL-Application
            language: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: source

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          source-root: source

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}-repository:${{ matrix.name }}
