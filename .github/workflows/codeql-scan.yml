name: CodeQL SAST Scan

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL - ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: juice-shop
            repo: juice-shop/juice-shop
            language: javascript-typescript
          - name: webgoat
            repo: WebGoat/WebGoat
            language: java-kotlin
          - name: nodegoat
            repo: OWASP/NodeGoat
            language: javascript-typescript
          - name: pygoat
            repo: adeyosemanputra/pygoat
            language: python
          - name: vulnshop
            repo: nr-yolo/Vulnshop
            language: javascript
            # source-root удалён. CodeQL будет искать код по всему репозиторию.
          - name: iwa-java
            repo: fortify/IWA-Java
            language: java-kotlin
          - name: vulnerable-java-app
            repo: siddharthoak/vulnerable-java-app
            language: java-kotlin
          - name: vulnbookstore
            repo: tobiasbruss/vulnerable-repo
            language: python
          - name: vulnerable-graphql
            repo: dolevf/Damn-Vulnerable-GraphQL-Application
            language: javascript-typescript
          - name: railsgoat
            repo: OWASP/railsgoat
            language: ruby

    steps:
      - name: Checkout ${{ matrix.project.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: target-repo

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Явно указываем build-mode: none для интерпретируемых языков
          build-mode: ${{ (matrix.language == 'javascript' || matrix.language == 'javascript-typescript' || matrix.language == 'python' || matrix.language == 'ruby') && 'none' || 'autobuild' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        # Autobuild теперь выполняется только если build-mode не 'none'
        if: matrix.language == 'java-kotlin' || matrix.language == 'csharp'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}/project:${{ matrix.project.name }}"
          output: codeql-results-${{ matrix.project.name }}
          upload: false

      - name: Prepare JSON Reports
        run: |
          mkdir -p final-json-reports
          find codeql-results-${{ matrix.project.name }} -name "*.sarif" -exec cp {} final-json-reports/${{ matrix.project.name }}-codeql.json \;
          if [ ! -f final-json-reports/${{ matrix.project.name }}-codeql.json ]; then
            echo '{"runs": [], "version": "2.1.0"}' > final-json-reports/${{ matrix.project.name }}-codeql.json
          fi

      - name: Upload JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: codeql-json-${{ matrix.project.name }}
          path: final-json-reports/*.json
          retention-days: 30
