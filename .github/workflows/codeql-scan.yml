name: CodeQL SAST Scan

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL - ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: juice-shop
            repo: juice-shop/juice-shop
            language: javascript-typescript
          - name: webgoat
            repo: WebGoat/WebGoat
            language: java-kotlin
          - name: nodegoat
            repo: OWASP/NodeGoat
            language: javascript-typescript
          - name: pygoat
            repo: adeyosemanputra/pygoat
            language: python
          - name: vulnshop
            repo: nr-yolo/Vulnshop
            language: javascript-typescript
          - name: iwa-java
            repo: fortify/IWA-Java
            language: java-kotlin
          - name: vulnerable-java-app
            repo: siddharthoak/vulnerable-java-app
            language: java-kotlin
          - name: vulnbookstore
            repo: tobiasbruss/vulnerable-repo
            language: python
          - name: vulnerable-graphql
            repo: dolevf/Damn-Vulnerable-GraphQL-Application
            language: javascript-typescript
          - name: railsgoat
            repo: OWASP/railsgoat
            language: ruby

    steps:
      - name: Checkout ${{ matrix.project.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: target-repo

      # 1. Инициализация CodeQL для ВСЕХ проектов, КРОМЕ vulnshop
      - name: Initialize CodeQL (Default)
        if: matrix.project.name != 'vulnshop'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          source-root: target-repo

      # 2. Инициализация CodeQL ТОЛЬКО для vulnshop с указанием путей
      - name: Initialize CodeQL (Vulnshop)
        if: matrix.project.name == 'vulnshop'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          source-root: target-repo
          paths: |
            target-repo/backend
            target-repo/frontend

      # 3. Автосборка (только для компилируемых языков)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        if: matrix.language == 'java-kotlin' || matrix.language == 'ruby'

      # 4. Анализ (не роняем пайплайн при ошибке)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}/project:${{ matrix.project.name }}"
          output: codeql-results-${{ matrix.project.name }}
          upload: false

      # 5. Подготовка JSON (выполняется всегда)
      - name: Prepare JSON Reports
        if: always()
        run: |
          mkdir -p final-json-reports
          # Копируем SARIF в JSON
          find codeql-results-${{ matrix.project.name }} -name "*.sarif" -exec cp {} final-json-reports/${{ matrix.project.name }}-codeql.json \; || true
          
          # Если файл так и не создался (проект упал), создаем пустой валидный JSON
          if [ ! -f final-json-reports/${{ matrix.project.name }}-codeql.json ]; then
            echo '{"runs": [], "version": "2.1.0"}' > final-json-reports/${{ matrix.project.name }}-codeql.json
          fi

      # 6. Загрузка артефактов (выполняется всегда)
      - name: Upload JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-json-${{ matrix.project.name }}
          path: final-json-reports/*.json
          retention-days: 30
