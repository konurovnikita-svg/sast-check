name: Semgrep Multi-Repo Scan

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 3 * * 1' # Опционально: еженедельный запуск

jobs:
  semgrep-scan:
    name: Scan - ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Продолжать сканирование остальных проектов, даже если один упал
      matrix:
        project:
          - name: "juice-shop"
            repo: "juice-shop/juice-shop"
          - name: "dvwa"
            repo: "digininja/DVWA"
          - name: "webgoat"
            repo: "WebGoat/WebGoat"
          - name: "nodegoat"
            repo: "OWASP/NodeGoat"
          - name: "pygoat"
            repo: "adeyosemanputr/pygoat"
          - name: "vulnshop"
            repo: "appsec-vulnerable/vulnshop" # Уточнить точный upstream-путь репозитория
          - name: "iwa-java"
            repo: "hdiv/iwa-java"               # Уточнить точный upstream-путь репозитория
          - name: "vulnerable-java-app"
            repo: "snyk-labs/java-goof"
          - name: "vulnbookstore"
            repo: "vulnbookstore/vulnbookstore" # Уточнить точный upstream-путь репозитория
          - name: "vulnerable-graphql"
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: target-repo

      - name: Run Semgrep with JSON Export
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/target-repo:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --json \
            --json-output=/${{ matrix.project.name }}-semgrep.json \
            . || true
          # Перемещаем отчет в корень рабочей директории для удобства выгрузки
          docker run --rm -v "${{ github.workspace }}/target-repo:/src" alpine mv /src/${{ matrix.project.name }}-semgrep.json /src/ 2>/dev/null || true

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-result-${{ matrix.project.name }}
          path: target-repo/${{ matrix.project.name }}-semgrep.json
          retention-days: 30
