name: CodeQL SAST Matrix Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Scan - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - bwapp
          - dvna
          - dvwa
          - juice-shop
          - nodegoat
          - railsgoat
          - vulnerable-flask-app
          - webgoat
          - xvwa

    steps:
      - name: Checkout ${{ matrix.project }}
        uses: actions/checkout@v4
        with:
          repository: konuronikita-svg/sast-check
          path: .
          fetch-depth: 1

      - name: Initialize CodeQL for ${{ matrix.project }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python, ruby, java-kotlin
          

      - name: Autobuild ${{ matrix.project }}
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.project }}"

      - name: Generate CSV Report from SARIF
        run: |
          
      - name: Upload CodeQL SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.project }}
          path: ${{ github.workspace }}/**/*.sarif
          retention-days: 30

      - name: Upload CodeQL CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-csv-${{ matrix.project }}
          path: codeql-${{ matrix.project }}.csv
          retention-days: 30
