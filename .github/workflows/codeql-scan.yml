name: CodeQL SAST Matrix Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Scan - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dvna
            language: javascript-typescript
          - project: juice-shop
            language: javascript-typescript
          - project: nodegoat
            language: javascript-typescript
          - project: railsgoat
            language: ruby
          - project: vulnerable-flask-app
            language: python
          - project: webgoat
            language: java-kotlin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get only this project
        run: git submodule update --init --depth 1 repos/${{ matrix.project }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
          upload: never

      - name: Generate CSV Report
        if: always()
        run: |
          echo "project,rule_id,severity,file,line,message" > codeql-${{ matrix.project }}.csv
          for f in codeql-results/*.sarif; do
            [ -f "$f" ] || continue
            jq -r --arg project "${{ matrix.project }}" '
              ([.runs[].tool.driver.rules[]?, .runs[].tool.extensions[]?.rules[]?] | map({(.id): .}) | add // {}) as $rules
              | .runs[].results[]?
              | [$project, .ruleId,
                 ((.level // $rules[.ruleId].defaultConfiguration.level // "N/A") | ascii_upcase),
                 (.locations[0].physicalLocation.artifactLocation.uri // "N/A"),
                 (.locations[0].physicalLocation.region.startLine // 0),
                 (.message.text | gsub("\n"; " "))] | @csv' "$f" >> codeql-${{ matrix.project }}.csv
          done

      - name: Upload CSV and SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.project }}
          path: |
            codeql-results/*.sarif
            codeql-${{ matrix.project }}.csv
          if-no-files-found: warn
          retention-days: 30
