
name: CodeQL External Repository Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: juice-shop
            repo: https://github.com/juice-shop/juice-shop.git
            language: javascript-typescript
            build_mode: none

          - name: dvwa
            repo: https://github.com/digininja/DVWA.git
            language: python
            build_mode: none

          - name: webgoat
            repo: https://github.com/WebGoat/WebGoat.git
            language: java-kotlin
            build_mode: autobuild

          - name: nodegoat
            repo: https://github.com/OWASP/NodeGoat.git
            language: javascript-typescript
            build_mode: none

          - name: pygoat
            repo: https://github.com/pygoat/pygoat.git
            language: python
            build_mode: none

          - name: vulnshop
            repo: REPLACE_WITH_VULNSHOP_URL
            language: javascript-typescript
            build_mode: none

          - name: iwa-java
            repo: REPLACE_WITH_IWA_JAVA_URL
            language: java-kotlin
            build_mode: autobuild

          - name: vulnerable-java-app
            repo: REPLACE_WITH_VULNERABLE_JAVA_APP_URL
            language: java-kotlin
            build_mode: autobuild

          - name: vulnbookstore
            repo: REPLACE_WITH_VULNBOOKSTORE_URL
            language: java-kotlin
            build_mode: autobuild

          - name: vulnerable-graphql
            repo: https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git
            language: python
            build_mode: none

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Clone target repository
        env:
          REPOSITORY_URL: ${{ matrix.repo }}
        run: |
          git clone --depth 1 "$REPOSITORY_URL" source

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          source-root: source
          build-mode: ${{ matrix.build_mode }}

      - name: Autobuild
        if: matrix.build_mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/external/${{ matrix.name }}"
          output: results
          upload: never

      - name: Save SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.name }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
