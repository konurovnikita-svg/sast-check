name: CodeQL - external supported-language portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL / ${{{{ matrix.project.name }}}}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project:
          - name: 01-juice-shop
            repo: "bkimminich/juice-shop"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 02-webgoat
            repo: "WebGoat/WebGoat"
            language: "java-kotlin"
            build-mode: "autobuild"
          - name: 03-pygoat
            repo: "adeyosemanputra/pygoat"
            language: "python"
            build-mode: "none"
          - name: 04-vulnshop
            repo: "dev-abhrajit/VulnShop"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 06-dvna
            repo: "appsecco/dvna"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 07-nodegoat
            repo: "OWASP/NodeGoat"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 08-iwa-java
            repo: "fortify/IWA-Java"
            language: "java-kotlin"
            build-mode: "autobuild"
          - name: 10-vulnerable-java-app
            repo: "ryanmcmorrowsnyk/vulnerable-java-app"
            language: "java-kotlin"
            build-mode: "autobuild"
          - name: 11-pygoat-sqli-xss
            repo: "adeyosemanputra/pygoat"
            language: "python"
            build-mode: "none"
          - name: 12-vulnerable-flask-app
            repo: "videvelopers/Vulnerable-Flask-App"
            language: "python"
            build-mode: "none"
          - name: 13-vulnerable-api
            repo: "jorritfolmer/vulnerable-api"
            language: "python"
            build-mode: "none"
          - name: 14-djangogoat
            repo: "red-and-black/DjangoGoat"
            language: "python"
            build-mode: "none"
          - name: 15-goof
            repo: "snyk/goof"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 17-vulnerable-javascript
            repo: "EyalSec/vulnerable-javascript"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 19-vulnerableapp-spring
            repo: "SasanLabs/VulnerableApp"
            language: "java-kotlin"
            build-mode: "autobuild"
          - name: 20-vulnado
            repo: "vulnerable-code/vulnado"
            language: "java-kotlin"
            build-mode: "autobuild"
          - name: 21-webgoat-net
            repo: "jerryhoff/WebGoat.NET"
            language: "csharp"
            build-mode: "autobuild"
          - name: 22-ticketmagpie
            repo: "dhatanian/ticketmagpie"
            language: "java-kotlin"
            build-mode: "autobuild"
          - name: 23-dvws
            repo: "interference-security/DVWS"
            language: "javascript-typescript"
            build-mode: "none"
          - name: 27-railsgoat
            repo: "OWASP/railsgoat"
            language: "ruby"
            build-mode: "none"
          - name: 29-damn-vulnerable-graphql
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"
            language: "python"
            build-mode: "none"


    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout external repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: source
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.project.language }}
          source-root: source
          build-mode: ${{ matrix.project.build-mode }}
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/external/${{ matrix.project.name }}"
          output: codeql-results
          upload: never

      - name: Upload SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.project.name }}
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 30
