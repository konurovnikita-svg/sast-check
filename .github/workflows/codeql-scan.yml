name: CodeQL SAST Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force submodule update
        run: git submodule update --init --recursive

      - name: Remove benchmark folder
        run: rm -rf repos/benchmark-java

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          source-root: repos

      - name: Build Java projects manually
        if: matrix.language == 'java-kotlin'
        run: |
          for dir in repos/*/; do
            if [ -f "$dir/pom.xml" ]; then
              (cd "$dir" && mvn -B -DskipTests clean install || true)
            elif [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              (cd "$dir" && chmod +x gradlew && ./gradlew build -x test || true)
            fi
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results

      - name: Upload CodeQL Reports
        uses: actions/upload-artifact@v4
        with:
          name: codeql-reports-${{ matrix.language }}
          path: codeql-results
