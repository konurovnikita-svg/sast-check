name: CodeQL Multi-Repo Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  codeql-scan:
    name: Scan - ${{ matrix.project.name }} (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: "juice-shop"
            repo: "juice-shop/juice-shop"
            language: "javascript-typescript"
          - name: "dvwa"
            repo: "digininja/DVWA"
            language: "php" # CodeQL не поддерживает PHP напрямую, потребуется ручная конвертация или выбор другого языка
          - name: "webgoat"
            repo: "WebGoat/WebGoat"
            language: "java-kotlin"
          - name: "nodegoat"
            repo: "OWASP/NodeGoat"
            language: "javascript-typescript"
          - name: "pygoat"
            repo: "adeyosemanputr/pygoat"
            language: "python"
          - name: "vulnshop"
            repo: "appsec-vulnerable/vulnshop"
            language: "javascript-typescript"
          - name: "iwa-java"
            repo: "hdiv/iwa-java"
            language: "java-kotlin"
          - name: "vulnerable-java-app"
            repo: "snyk-labs/java-goof"
            language: "java-kotlin"
          - name: "vulnbookstore"
            repo: "vulnbookstore/vulnbookstore"
            language: "python"
          - name: "vulnerable-graphql"
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"
            language: "javascript-typescript"

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: target-repo

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          source-root: target-repo

      - name: Autobuild (if compiled language)
        uses: github/codeql-action/autobuild@v3
        if: matrix.language == 'java-kotlin'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}/project:${{ matrix.project.name }}"
          output: codeql-results-${{ matrix.project.name }}
          upload: false # Отключаем автоматическую загрузку SARIF, чтобы не засорять вкладку Security

      - name: Convert BQRS to JSON
        run: |
          # Поиск всех сгенерированных файлов .bqrs и конвертация их в JSON
          find codeql-results-${{ matrix.project.name }} -name "*.bqrs" | while read bqrs_file; do
            json_file="${bqrs_file%.bqrs}.json"
            codeql bqrs decode --format=json --output="$json_file" "$bqrs_file"
          done
        # Примечание: если CLI не установлен в PATH по умолчанию, используйте полный путь к бинарнику CodeQL

      - name: Upload JSON Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeql-json-${{ matrix.project.name }}
          path: codeql-results-${{ matrix.project.name }}/**/*.json
          retention-days: 30
