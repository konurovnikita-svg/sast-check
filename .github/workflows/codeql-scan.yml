
name: CodeQL External Repository Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: juice-shop
            repo: https://github.com/juice-shop/juice-shop.git
            language: javascript-typescript
            build_mode: none

          - name: dvwa
            repo: https://github.com/digininja/DVWA.git
            language: php
            build_mode: none

          - name: webgoat
            repo: https://github.com/WebGoat/WebGoat.git
            language: java-kotlin
            build_mode: autobuild

          - name: nodegoat
            repo: https://github.com/OWASP/NodeGoat.git
            language: javascript-typescript
            build_mode: none

          - name: pygoat
            repo: https://github.com/adeyosemanputra/pygoat.git
            language: python
            build_mode: none

          - name: vulnshop
            repo: https://github.com/dev-abhrajit/VulnShop.git
            language: python
            build_mode: none

          - name: iwa-java
            repo: https://github.com/fortify/IWA-Java.git
            language: java-kotlin
            build_mode: autobuild

          - name: vulnerable-java-app
            repo: https://github.com/ryanmcmorrowsnyk/vulnerable-java-app.git
            language: java-kotlin
            build_mode: autobuild

          - name: vulnbookstore
            repo: https://github.com/REPLACE_WITH_OWNER/VulnBookStore.git
            language: javascript-typescript
            build_mode: none

          - name: vulnerable-graphql
            repo: https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git
            language: python
            build_mode: none

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Validate repository URL
        env:
          REPOSITORY_URL: ${{ matrix.repo }}
        run: |
          if [[ "$REPOSITORY_URL" == *"REPLACE_WITH"* ]]; then
            echo "::error::Repository URL for ${{ matrix.name }} is still a placeholder."
            exit 1
          fi

      - name: Clone target repository
        env:
          REPOSITORY_URL: ${{ matrix.repo }}
        run: |
          git clone --depth 1 "$REPOSITORY_URL" source

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          source-root: source
          build-mode: ${{ matrix.build_mode }}

      - name: Autobuild
        if: matrix.build_mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/external/${{ matrix.name }}"
          output: results
          upload: never

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.name }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
