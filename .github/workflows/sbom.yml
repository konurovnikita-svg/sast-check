name: SBOM Scan Vulnerable Apps

on:
  workflow_dispatch:

# Даем права на запись, чтобы экшен мог коммитить файлы обратно в репозиторий
permissions:
  contents: write
  pull-requests: write

jobs:
  # --- JOB 1: Сканирование всех проектов ---
  sbom-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DVGA
            repo: https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application
          - name: DVNA
            repo: https://github.com/appsecco/dvna
          - name: DVPWA
            repo: https://github.com/anxolerd/dvpwa
          - name: DVWA
            repo: https://github.com/digininja/DVWA
          - name: DVWS
            repo: https://github.com/interference-security/DVWS
          - name: Damn-Vulnerable-Flask-App
            repo: https://github.com/fatinsourav/Damn-Vulnerable-Flask-Application
          - name: DjangoGoat
            repo: https://github.com/s-santillan/DjangoGoat
          - name: Goof
            repo: https://github.com/snyk/goof
          - name: IWA
            repo: https://github.com/fortify-presales/IWA-Java
          - name: OWASP-Benchmark-Java
            repo: https://github.com/OWASP-Benchmark/BenchmarkJava
          - name: OWASP-Juice-Shop
            repo: https://github.com/juice-shop/juice-shop
          - name: OWASP-Mutillidae
            repo: https://github.com/webpwnized/mutillidae
          - name: OWASP-NodeGoat
            repo: https://github.com/OWASP/NodeGoat
          - name: OWASP-WebGoat
            repo: https://github.com/WebGoat/WebGoat
          - name: PyGoat
            repo: https://github.com/adeyosemanputra/pygoat
          - name: RailsGoat
            repo: https://github.com/OWASP/railsgoat
          - name: TicketMagpie
            repo: https://github.com/dhatanian/ticketmagpie
          - name: VAmPI
            repo: https://github.com/erev0s/VAmPI
          - name: Vuln-Bookstore
            repo: https://github.com/tobiasbruss/vulnerable-repo
          - name: Vuln-GraphQL-Ruby
            repo: https://github.com/kaakaww/vuln-graphql-ruby
          - name: VulnBookStore
            repo: https://github.com/tobiasbruss/vulnerable-repo
          - name: VulnShop-Django
            repo: https://github.com/nr-yolo/Vulnshop
          - name: Vulnado
            repo: https://github.com/Contrast-Security-OSS/vulnado
          - name: Vulnerable-API
            repo: https://github.com/mattvaldes/vulnerable-api
          - name: Vulnerable-OTP-App
            repo: https://github.com/mddanish/Vulnerable-OTP-Application
          - name: Vulnerable-React-App
            repo: https://github.com/vulnerable-apps/vulnerable-react-app
          - name: VulnerableApp
            repo: https://github.com/SasanLabs/VulnerableApp
          - name: WebGoat.NET
            repo: https://github.com/jerryhoff/WebGoat.NET
          - name: XVWA
            repo: https://github.com/s4n7h0/xvwa
          - name: bWAPP
            repo: https://github.com/lelouch-repo/buggy-app

    steps:
      - name: Clone ${{ matrix.name }}
        id: clone
        run: git clone --depth 1 ${{ matrix.repo }} ${{ matrix.name }}
        continue-on-error: true

      - name: Install Syft
        if: steps.clone.outcome == 'success'
        uses: anchore/sbom-action/download-syft@v0

      - name: Install CDXgen
        if: steps.clone.outcome == 'success'
        run: npm install -g @cyclonedx/cdxgen

      - name: Prepare output dir
        if: steps.clone.outcome == 'success'
        run: mkdir -p output/${{ matrix.name }}

      - name: Run Syft
        if: steps.clone.outcome == 'success'
        run: |
          syft dir:${{ matrix.name }} \
            -o cyclonedx-json=output/${{ matrix.name }}/syft-bom.cdx.json

      - name: Run CDXgen
        if: steps.clone.outcome == 'success'
        run: |
          cdxgen -o output/${{ matrix.name }}/cdxgen-bom.cdx.json ${{ matrix.name }}

      - name: Upload individual project artifact
        if: steps.clone.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: temp-sbom-${{ matrix.name }}
          path: output/${{ matrix.name }}/
          retention-days: 1

  # --- JOB 2: Сборка общих таблиц и коммит в репозиторий ---
  merge-and-commit:
    needs: sbom-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Или укажите вашу основную ветку, если она называется иначе

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: temp-sbom-*
          path: all-sboms/
          merge-multiple: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Merged CSVs
        run: |
          mkdir -p sbom-tables
          
          # 1. Генерация Syft CSV
          echo "Project,Name,Version,Type,PURL" > sbom-tables/syft-all-projects.csv
          for project_dir in all-sboms/*/; do
            project_name=$(basename "$project_dir")
            json_file="${project_dir}syft-bom.cdx.json"
            if [ -f "$json_file" ]; then
              jq -r --arg proj "$project_name" '
                .components[]? | [$proj, (.name // ""), (.version // ""), (.type // ""), (.purl // "")] | @csv
              ' "$json_file" >> sbom-tables/syft-all-projects.csv 2>/dev/null || true
            fi
          done

          # 2. Генерация CDXgen CSV
          echo "Project,Name,Version,Type,PURL" > sbom-tables/cdxgen-all-projects.csv
          for project_dir in all-sboms/*/; do
            project_name=$(basename "$project_dir")
            json_file="${project_dir}cdxgen-bom.cdx.json"
            if [ -f "$json_file" ]; then
              jq -r --arg proj "$project_name" '
                .components[]? | [$proj, (.name // ""), (.version // ""), (.type // ""), (.purl // "")] | @csv
              ' "$json_file" >> sbom-tables/cdxgen-all-projects.csv 2>/dev/null || true
            fi
          done
          
          echo "Таблицы созданы:"
          wc -l sbom-tables/*.csv

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update merged SBOM tables"
          file_pattern: "sbom-tables/*.csv"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
