name: Setup Folders and Run SAST

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sast-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - project: OWASP-Juice-Shop
            repo: https://github.com/juice-shop/juice-shop.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: OWASP-WebGoat
            repo: https://github.com/WebGoat/WebGoat.git
            semgrep: true
            codeql_language: java-kotlin
          - project: OWASP-NodeGoat
            repo: https://github.com/OWASP/NodeGoat.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: DVWA
            repo: https://github.com/digininja/DVWA.git
            semgrep: true
            codeql_language: skip
          - project: OWASP-Benchmark-Java
            repo: https://github.com/OWASP/BenchmarkJava.git
            semgrep: true
            codeql_language: java-kotlin
          - project: VulnBookStore
            repo: https://github.com/Defcon2019/vulnerable-repo.git
            semgrep: true
            codeql_language: java-kotlin
          - project: VulnShop-Django
            repo: https://github.com/laugiov/code-safety.git
            semgrep: true
            codeql_language: python
          - project: PyGoat
            repo: https://github.com/adeyosemanputra/pygoat.git
            semgrep: true
            codeql_language: python
          - project: VAmPI
            repo: https://github.com/erev0s/VAmPI.git
            semgrep: true
            codeql_language: python
          - project: DVGA
            repo: https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git
            semgrep: true
            codeql_language: python
          - project: VulnerableApp
            repo: https://github.com/SasanLabs/VulnerableApp.git
            semgrep: true
            codeql_language: java-kotlin
          - project: OWASP-Mutillidae
            repo: https://github.com/webpwnized/mutillidae.git
            semgrep: true
            codeql_language: skip
          - project: DVWS
            repo: https://github.com/interference-security/DVWS.git
            semgrep: true
            codeql_language: skip
          - project: XVWA
            repo: https://github.com/s4n7h0/xvwa.git
            semgrep: true
            codeql_language: skip
          - project: bWAPP
            repo: https://github.com/jehy-security/bwapp.git
            semgrep: true
            codeql_language: skip
          - project: Vulnado
            repo: https://github.com/ScaleSec/vulnado.git
            semgrep: true
            codeql_language: java-kotlin
          - project: WebGoat.NET
            repo: https://github.com/jerryhoff/WebGoat.NET.git
            semgrep: true
            codeql_language: csharp
          - project: RailsGoat
            repo: https://github.com/OWASP/railsgoat.git
            semgrep: true
            codeql_language: ruby
          - project: TicketMagpie
            repo: https://github.com/dhatanian/ticketmagpie.git
            semgrep: true
            codeql_language: java-kotlin
          - project: Vulnerable-OTP-App
            repo: https://github.com/mddanish/Vulnerable-OTP-Application.git
            semgrep: true
            codeql_language: skip
          - project: Damn-Vulnerable-Flask-App
            repo: https://github.com/maximilianmarx/DVFA.git
            semgrep: true
            codeql_language: python
          - project: DVPWA
            repo: https://github.com/anxolerd/dvpwa.git
            semgrep: true
            codeql_language: python
          - project: Vuln-GraphQL-Ruby
            repo: https://github.com/rmosolgo/graphql-ruby.git
            semgrep: true
            codeql_language: ruby
          - project: IWA
            repo: https://github.com/fortify/IWA-Java.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: DVNA
            repo: https://github.com/appsecco/dvna.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: Goof
            repo: https://github.com/snyk/goof.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: Vulnerable-React-App
            repo: https://github.com/vulnerable-apps/javulna.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: Vulnerable-API
            repo: https://github.com/DevCyberNova/vulnerable-api.git
            semgrep: true
            codeql_language: javascript-typescript
          - project: DjangoGoat
            repo: https://github.com/adeyosemanputra/pygoat.git
            semgrep: true
            codeql_language: python
          - project: Vuln-Bookstore
            repo: https://github.com/Defcon2019/vulnerable-repo.git
            semgrep: true
            codeql_language: java-kotlin

    steps:
      - name: Checkout collector repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create required directories
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          mkdir -p "$PROJECT/default" "$PROJECT/semgrep" "$PROJECT/codeql"
          touch "$PROJECT/default/.gitkeep" "$PROJECT/semgrep/.gitkeep" "$PROJECT/codeql/.gitkeep"

      - name: Clone target repository
        id: clone
        env:
          PROJECT: ${{ matrix.project }}
          REPO: ${{ matrix.repo }}
        shell: bash
        run: |
          set +e
          rm -rf "$PROJECT/src"
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 "$REPO" "$PROJECT/src" > /tmp/clone.log 2>&1
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "cloned=true" >> "$GITHUB_OUTPUT"
            rm -rf "$PROJECT/src/.git"
            echo "Clone succeeded: $REPO"
          else
            echo "cloned=false" >> "$GITHUB_OUTPUT"
            {
              echo "Clone failed."
              echo "Repository: $REPO"
              echo
              cat /tmp/clone.log
            } > "$PROJECT/semgrep/clone-error.txt"
            echo "::warning title=Repository clone failed::$PROJECT could not be cloned; both scanners will be skipped."
            cat /tmp/clone.log
          fi

      - name: Check source files for CodeQL language
        id: source
        if: steps.clone.outputs.cloned == 'true' && matrix.codeql_language != 'skip'
        env:
          PROJECT: ${{ matrix.project }}
          CODEQL_LANGUAGE: ${{ matrix.codeql_language }}
        shell: bash
        run: |
          SRC="$PROJECT/src"
          case "$CODEQL_LANGUAGE" in
            javascript-typescript)
              pattern='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue|html|htm)$'
              ;;
            python)
              pattern='\.(py|pyw)$'
              ;;
            ruby)
              pattern='\.(rb|erb|gemspec)$'
              ;;
            java-kotlin)
              pattern='\.(java|kt|kts)$'
              ;;
            csharp)
              pattern='\.(cs)$'
              ;;
            *)
              pattern='a^'
              ;;
          esac

          if find "$SRC" -type f | grep -Eiq "$pattern"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Source files for $CODEQL_LANGUAGE were found."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "CodeQL skipped: no source files for $CODEQL_LANGUAGE were found."
              echo "Expected file extensions: $pattern"
            } > "$PROJECT/codeql/scan-status.txt"
            echo "::warning title=No CodeQL source::$PROJECT contains no detected source files for $CODEQL_LANGUAGE."
          fi

      - name: Install Semgrep
        if: steps.clone.outputs.cloned == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        id: semgrep
        if: steps.clone.outputs.cloned == 'true'
        continue-on-error: true
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set +e
          REPORT="$PROJECT/semgrep/${PROJECT}_semgrep.json"
          TEMP_REPORT="$(mktemp)"
          semgrep scan --config auto --json --output "$TEMP_REPORT" "$PROJECT/src"
          result=$?
          set -e

          if [ -s "$TEMP_REPORT" ] && jq -e . "$TEMP_REPORT" >/dev/null 2>&1; then
            mv "$TEMP_REPORT" "$REPORT"
            echo "Semgrep JSON report saved: $REPORT"
            echo "Semgrep exit code: $result"
          else
            rm -f "$TEMP_REPORT"
            {
              echo "Semgrep did not produce a valid JSON report."
              echo "Exit code: $result"
              echo "An existing report, if present, was preserved."
            } > "$PROJECT/semgrep/scan-status.txt"
            echo "::warning title=Semgrep report missing::$PROJECT did not produce a valid JSON report."
          fi

      - name: Initialize CodeQL
        id: codeql_init
        continue-on-error: true
        if: steps.clone.outputs.cloned == 'true' && matrix.codeql_language != 'skip' && steps.source.outputs.found == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.codeql_language }}
          build-mode: none

      - name: Analyze with CodeQL
        if: steps.clone.outputs.cloned == 'true' && matrix.codeql_language != 'skip' && steps.source.outputs.found == 'true' && steps.codeql_init.outcome == 'success'
        id: codeql
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          output: ${{ matrix.project }}/codeql
          upload: false

      - name: Record CodeQL analysis failure
        if: always() && (steps.codeql_init.outcome == 'failure' || steps.codeql.outcome == 'failure')
        env:
          PROJECT: ${{ matrix.project }}
          INIT_OUTCOME: ${{ steps.codeql_init.outcome }}
          ANALYZE_OUTCOME: ${{ steps.codeql.outcome }}
        shell: bash
        run: |
          {
            echo "CodeQL analysis failed."
            echo "Initialization: $INIT_OUTCOME"
            echo "Analyze: $ANALYZE_OUTCOME"
            echo "See this job's CodeQL logs for the detailed error."
          } > "$PROJECT/codeql/scan-status.txt"

      - name: Record CodeQL skip reason
        if: always() && (matrix.codeql_language == 'skip' || steps.clone.outputs.cloned != 'true' || (steps.source.outcome == 'success' && steps.source.outputs.found != 'true'))
        env:
          PROJECT: ${{ matrix.project }}
          CODEQL_LANGUAGE: ${{ matrix.codeql_language }}
          CLONED: ${{ steps.clone.outputs.cloned }}
        shell: bash
        run: |
          if [ "$CLONED" != "true" ]; then
            echo "CodeQL was not run because cloning failed." > "$PROJECT/codeql/scan-status.txt"
          elif [ "$CODEQL_LANGUAGE" = "skip" ]; then
            echo "CodeQL does not support this project's configured language. Semgrep was still run." > "$PROJECT/codeql/scan-status.txt"
          elif [ ! -f "$PROJECT/codeql/scan-status.txt" ]; then
            echo "CodeQL source detection did not complete. Check the job log." > "$PROJECT/codeql/scan-status.txt"
          fi

      - name: Upload project results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-${{ matrix.project }}
          path: ${{ matrix.project }}/
          if-no-files-found: warn
          retention-days: 3

  save-results:
    name: Save all project results
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout collector repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download project artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: project-*
          path: downloaded-results
          merge-multiple: false

      - name: Merge project results without touching default files
        shell: bash
        run: |
          shopt -s nullglob
          for artifact_dir in downloaded-results/project-*; do
            project="${artifact_dir##*/project-}"
            mkdir -p "$project/semgrep" "$project/codeql" "$project/default"

            # Copy scanner outputs and status files. Never replace default/:
            # it is reserved for manually maintained ground-truth data.
            if [ -d "$artifact_dir/semgrep" ]; then
              cp -a "$artifact_dir/semgrep/." "$project/semgrep/"
            fi
            if [ -d "$artifact_dir/codeql" ]; then
              cp -a "$artifact_dir/codeql/." "$project/codeql/"
            fi
            touch "$project/default/.gitkeep" "$project/semgrep/.gitkeep" "$project/codeql/.gitkeep"
          done

      - name: Commit and push results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*/semgrep/*' '*/codeql/*' '*/default/.gitkeep'
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Update SAST scan results"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
