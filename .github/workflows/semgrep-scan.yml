name: Semgrep SAST Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force submodule update
        run: git submodule update --init --recursive

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SARIF for Security tab)
        run: |
          semgrep scan --config auto --config p/owasp-top-ten --config p/security-audit --no-git-ignore \
          --exclude=repos/benchmark-java/ \
          --sarif --output semgrep.sarif \
          repos/ || true

      - name: Run Semgrep (JSON for CSV report)
        run: |
          semgrep scan --config auto --config p/owasp-top-ten --config p/security-audit --no-git-ignore \
          --exclude=repos/benchmark-java/ \
          --json --output semgrep-results.json \
          repos/ || true

      - name: Convert JSON to CSV
        run: |
          python3 - <<'PY'
          import json, csv, os
          try:
              with open('semgrep-results.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              results = data.get('results', [])
              with open('semgrep-results.csv', 'w', newline='', encoding='utf-8') as f:
                  writer = csv.writer(f)
                  writer.writerow(['Проект', 'Путь к файлу', 'Правило (Ошибка)', 'Описание', 'Критичность', 'Строка'])
                  for r in results:
                      path = r.get('path', '')
                      parts = path.split(os.sep)
                      project = parts[1] if len(parts) > 1 else 'unknown'
                      msg = r.get('extra', {}).get('message', '').replace('\n', ' ')
                      writer.writerow([project, path, r.get('check_id', ''), msg, r.get('extra', {}).get('severity', ''), r.get('start', {}).get('line', '')])
          except Exception as e:
              print(f"Ошибка конвертации: {e}")
          PY

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-results.csv
            semgrep-results.json
            semgrep.sarif
