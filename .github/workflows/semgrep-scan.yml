name: Semgrep SAST Scan

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  semgrep:
    name: Semgrep - ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: juice-shop
            repo: juice-shop/juice-shop
          - name: dvwa
            repo: digininja/DVWA
          - name: webgoat
            repo: WebGoat/WebGoat
          - name: nodegoat
            repo: OWASP/NodeGoat
          - name: pygoat
            repo: adeyosemanputra/pygoat
          - name: vulnshop
            repo: nr-yolo/Vulnshop
          - name: iwa-java
            repo: fortify/IWA-Java
          - name: vulnerable-java-app
            repo: siddharthoak/vulnerable-java-app
          - name: vulnbookstore
            repo: tobiasbruss/vulnerable-repo
          - name: vulnerable-graphql
            repo: dolevf/Damn-Vulnerable-GraphQL-Application
          - name: bwapp
            repo: lelouch-repo/buggy-app
          - name: railsgoat
            repo: OWASP/railsgoat
          - name: vulnerable-flask-app
            repo: videvelopers/Vulnerable-Flask-App
          - name: xvwa
            repo: s4n7h0/xvwa

    steps:
      - name: Checkout ${{ matrix.project.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: target-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (JSON)
        run: |
          semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --json \
            --output=semgrep-results.json \
            target-repo || true
          # Если файл не создался, создаем пустой, чтобы шаг загрузки не упал
          if [ ! -f semgrep-results.json ]; then
            echo '{"results": [], "errors": []}' > semgrep-results.json
          fi

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json-${{ matrix.project.name }}
          path: semgrep-results.json
          retention-days: 30
