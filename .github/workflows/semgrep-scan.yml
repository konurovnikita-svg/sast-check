name: Semgrep - external vulnerable-app portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep / ${{{{ matrix.project.name }}}}
    if: ${{{{ matrix.project.enabled }}}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project:
          - name: 01-juice-shop
            repo: "bkimminich/juice-shop"
            enabled: true
          - name: 02-webgoat
            repo: "WebGoat/WebGoat"
            enabled: true
          - name: 03-pygoat
            repo: "adeyosemanputra/pygoat"
            enabled: true
          - name: 04-vulnshop
            repo: "dev-abhrajit/VulnShop"
            enabled: true
          - name: 05-vuln-bookstore
            repo: ""
            enabled: false
          - name: 06-dvna
            repo: "appsecco/dvna"
            enabled: true
          - name: 07-nodegoat
            repo: "OWASP/NodeGoat"
            enabled: true
          - name: 08-iwa-java
            repo: "fortify/IWA-Java"
            enabled: true
          - name: 09-dvma-mysql
            repo: ""
            enabled: false
          - name: 10-vulnerable-java-app
            repo: "ryanmcmorrowsnyk/vulnerable-java-app"
            enabled: true
          - name: 11-pygoat-sqli-xss
            repo: "adeyosemanputra/pygoat"
            enabled: true
          - name: 12-vulnerable-flask-app
            repo: "videvelopers/Vulnerable-Flask-App"
            enabled: true
          - name: 13-vulnerable-api
            repo: "jorritfolmer/vulnerable-api"
            enabled: true
          - name: 14-djangogoat
            repo: "red-and-black/DjangoGoat"
            enabled: true
          - name: 15-goof
            repo: "snyk/goof"
            enabled: true
          - name: 16-vulnerable-web-app
            repo: ""
            enabled: false
          - name: 17-vulnerable-javascript
            repo: "EyalSec/vulnerable-javascript"
            enabled: true
          - name: 18-vulnerable-react-app
            repo: ""
            enabled: false
          - name: 19-vulnerableapp-spring
            repo: "SasanLabs/VulnerableApp"
            enabled: true
          - name: 20-vulnado
            repo: "vulnerable-code/vulnado"
            enabled: true
          - name: 21-webgoat-net
            repo: "jerryhoff/WebGoat.NET"
            enabled: true
          - name: 22-ticketmagpie
            repo: "dhatanian/ticketmagpie"
            enabled: true
          - name: 23-dvws
            repo: "interference-security/DVWS"
            enabled: true
          - name: 24-xvwa
            repo: "s4n7h0/xvwa"
            enabled: true
          - name: 25-websheep
            repo: ""
            enabled: false
          - name: 26-vulnerable-otp-application
            repo: "mddanish/Vulnerable-OTP-Application"
            enabled: true
          - name: 27-railsgoat
            repo: "OWASP/railsgoat"
            enabled: true
          - name: 28-vuln-graphql-ruby
            repo: ""
            enabled: false
          - name: 29-damn-vulnerable-graphql
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"
            enabled: true
          - name: 30-vapi
            repo: "roottusk/vapi"
            enabled: true

    steps:
      - name: Validate repository
        env:
          REPOSITORY: ${{ matrix.project.repo }}
        run: |
          set -euo pipefail
          if [[ -z "$REPOSITORY" ]]; then
            echo "::error::Repository URL is not configured for this project."
            exit 1
          fi

      - name: Checkout external repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          path: source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        id: scan
        working-directory: source
        run: |
          set -euo pipefail
          semgrep scan \\
            --config p/default \\
            --config p/owasp-top-ten \\
            --json \\
            --output ../semgrep-results.json

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ matrix.project.name }}
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 30
