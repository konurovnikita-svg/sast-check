name: Semgrep SAST Matrix Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - bwapp
          - dvna
          - dvwa
          - juice-shop
          - nodegoat
          - railsgoat
          - vulnerable-flask-app
          - webgoat
          - xvwa
          - benchmark-java  # Добавлен проект из вашего списка

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive # Критически важно для выкачивания кода проектов
          fetch-depth: 0

      - name: Run Semgrep on ${{ matrix.project }}
        # Указываем путь к конкретному проекту внутри папки repos
        run: |
          semgrep scan --config auto \
            --sarif --output semgrep-${{ matrix.project }}.sarif \
            --json --output semgrep-${{ matrix.project }}.json \
            repos/${{ matrix.project }}
          # Генерация читаемого CSV отчета
          echo "project,rule_id,severity,file,line,message" > semgrep-${{ matrix.project }}.csv
          jq -r --arg project "${{ matrix.project }}" '.results[] | [$project, .check_id, .extra.severity, .path, .start.line, (.extra.message | gsub("\n"; " "))] | @csv' semgrep-${{ matrix.project }}.json >> semgrep-${{ matrix.project }}.csv

      - name: Upload Semgrep SARIF & CSV
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results-${{ matrix.project }}
          path: |
            semgrep-${{ matrix.project }}.sarif
            semgrep-${{ matrix.project }}.csv
          retention-days: 30

      - name: Upload SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-${{ matrix.project }}.sarif
          category: semgrep-${{ matrix.project }}
        if: always()
