name: Semgrep SAST Matrix Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - bwapp
          - dvna
          - dvwa
          - juice-shop
          - nodegoat
          - railsgoat
          - vulnerable-flask-app
          - webgoat
          - xvwa

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout ${{ matrix.project }}
        uses: actions/checkout@v4
        with:
          repository: konuronikita-svg/sast-check
          path: .
          fetch-depth: 1

      - name: Run Semgrep on ${{ matrix.project }}
        run: |
          semgrep scan --config auto \
            --sarif --output semgrep-${{ matrix.project }}.sarif \
            repos/${{ matrix.project }}

      - name: Convert SARIF to CSV (опционально)
        run: |
          # Пример конвертации можно реализовать через jq или semgrep --json
          semgrep scan --config auto --json --output semgrep-${{ matrix.project }}.json repos/${{ matrix.project }}
          # Простая конвертация JSON в CSV (пример)
          echo "project,rule_id,severity,file,line,message" > semgrep-${{ matrix.project }}.csv
          jq -r --arg project "${{ matrix.project }}" '.results[] | [$project, .check_id, .extra.severity, .path, .start.line, .extra.message] | @csv' semgrep-${{ matrix.project }}.json >> semgrep-${{ matrix.project }}.csv

      - name: Upload Semgrep SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-${{ matrix.project }}
          path: semgrep-${{ matrix.project }}.sarif
          retention-days: 30

      - name: Upload Semgrep CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-csv-${{ matrix.project }}
          path: semgrep-${{ matrix.project }}.csv
          retention-days: 30

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-${{ matrix.project }}.sarif
          category: semgrep-${{ matrix.project }}
        if: always()
