name: Semgrep SAST Matrix Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - bwapp
          - dvna
          - dvwa
          - juice-shop
          - nodegoat
          - railsgoat
          - vulnerable-flask-app
          - webgoat
          - xvwa

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep on ${{ matrix.project }}
        continue-on-error: true
        run: |
          semgrep scan --config auto \
            --sarif --output semgrep-${{ matrix.project }}.sarif \
            repos/${{ matrix.project }} || true

      - name: Generate CSV and Debug Output
        if: always()
        run: |
          ls -la semgrep-${{ matrix.project }}.* || echo "Файлы не найдены"

          if [ -f "semgrep-${{ matrix.project }}.sarif" ]; then
            echo "project,rule_id,severity,file,line,message" > semgrep-${{ matrix.project }}.csv
            # Ищем severity в properties самого результата, либо в определении правила (rules)
            jq -r --arg project "${{ matrix.project }}" '
              .runs[] as $run |
              $run.results[]? |
              . as $result |
              ($run.rules[]? | select(.id == $result.ruleId) | .properties.severity) as $rule_sev |
              [
                $project,
                $result.ruleId,
                (($result.properties.severity // $rule_sev // $result.level // "N/A") | tostring | ascii_upcase),
                ($result.locations[0].physicalLocation.artifactLocation.uri // "N/A"),
                ($result.locations[0].physicalLocation.region.startLine // 0),
                ($result.message.text // "" | gsub("\n"; " "))
              ] | @csv
            ' semgrep-${{ matrix.project }}.sarif >> semgrep-${{ matrix.project }}.csv
            
            echo "--- Первые 5 строк отчета ---"
            head -n 5 semgrep-${{ matrix.project }}.csv
          else
            echo '{"version": "2.1.0", "runs": []}' > semgrep-${{ matrix.project }}.sarif
            echo "project,rule_id,severity,file,line,message" > semgrep-${{ matrix.project }}.csv
          fi

      - name: Upload Semgrep Reports (SARIF & CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results-${{ matrix.project }}
          path: |
            semgrep-${{ matrix.project }}.sarif
            semgrep-${{ matrix.project }}.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF to Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-${{ matrix.project }}.sarif
          category: semgrep-${{ matrix.project }}
        continue-on-error: true
