name: Semgrep SAST Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force submodule update
        run: git submodule update --init --recursive

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        # Генерируем только JSON и SARIF, так как флага --csv не существует
        run: |
          semgrep scan --config auto --config p/owasp-top-ten --config p/security-audit --no-git-ignore \
          --exclude=repos/benchmark-java/ \
          --sarif --output semgrep.sarif \
          --json --output semgrep-results.json \
          repos/

      # Шаг для конвертации JSON в CSV
      - name: Convert JSON to CSV
        run: |
          python3 - <<'PY'
          import json
          import csv
          import os
          
          # Загружаем результаты из JSON
          with open('semgrep-results.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          
          results = data.get('results', [])
          
          # Определяем поля для CSV
          fieldnames = ['project', 'path', 'rule_id', 'message', 'severity', 'start_line', 'end_line']
          
          with open('semgrep-results.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              
              for r in results:
                  path = r.get('path', '')
                  # Извлекаем название проекта из пути (например, repos/juice-shop/... -> juice-shop)
                  parts = path.split(os.sep)
                  project = parts[1] if len(parts) > 1 else 'unknown'
                  
                  writer.writerow({
                      'project': project,
                      'path': path,
                      'rule_id': r.get('check_id', ''),
                      'message': r.get('extra', {}).get('message', ''),
                      'severity': r.get('extra', {}).get('severity', ''),
                      'start_line': r.get('start', {}).get('line', ''),
                      'end_line': r.get('end', {}).get('line', '')
                  })
          print(f"CSV файл создан. Найдено {len(results)} уязвимостей.")
          PY

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-results.csv
            semgrep-results.json
            semgrep.sarif
