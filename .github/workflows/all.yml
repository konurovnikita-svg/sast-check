name: SAST  (CodeQL & Semgrep)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-scan:
    name: Scan ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "01-Juice-Shop"
            repo: "juice-shop/juice-shop"
            lang: "javascript"
          - name: "02-WebGoat"
            repo: "WebGoat/WebGoat"
            lang: "java"
          - name: "03-PyGoat"
            repo: "adeyosemanputra/pygoat"
            lang: "python"
          - name: "04-Vulnshop"
            repo: "dev-abhrajit/VulnShop"
            lang: "javascript"
          - name: "05-Vuln-Bookstore"
            repo: "tobiasbruss/vulnerable-repo"
            lang: "java"
          - name: "06-DVNA"
            repo: "appsecco/dvna"
            lang: "javascript"
          - name: "07-NodeGoat"
            repo: "OWASP/NodeGoat"
            lang: "javascript"
          - name: "08-IWA"
            repo: "fortify/IWA-Java"
            lang: "java"
          - name: "10-VulnerableApp"
            repo: "SasanLabs/VulnerableApp"
            lang: "java"
          - name: "11-PyGoat-SQLi-XSS"
            repo: "adeyosemanputra/pygoat"
            lang: "python"
          - name: "12-Vulnerable-Flask-App"
            repo: "videvelopers/Vulnerable-Flask-App"
            lang: "python"
          - name: "13-Vulnerable-API"
            repo: "mattvaldes/vulnerable-api"
            lang: "python"
          - name: "14-DjangoGoat"
            repo: "miguelfreitas93/DjangoGoat"
            lang: "python"
          - name: "15-Goof"
            repo: "snyk-labs/nodejs-goof"
            lang: "javascript"
          - name: "16-Vulnerable-Web-App"
            repo: "nr-yolo/Vulnshop"
            lang: "javascript"
          - name: "17-Vulnerable-JavaScript"
            repo: "EyalSec/vulnerable-javascript"
            lang: "javascript"
          - name: "19-VulnerableApp-Spring"
            repo: "SasanLabs/VulnerableApp"
            lang: "java"
          - name: "20-Vulnado"
            repo: "vulnerable-code/vulnado"
            lang: "java"
          - name: "21-WebGoat-NET"
            repo: "jerryhoff/WebGoat.NET"
            lang: "csharp"
          - name: "22-Ticketmagpie"
            repo: "dhatanian/ticketmagpie"
            lang: "java"
          - name: "23-DVWS"
            repo: "interference-security/DVWS"
            lang: "javascript"
          - name: "24-XVWA"
            repo: "s4n7h0/xvwa"
            lang: "javascript"
          - name: "25-Websheep"
            repo: "marmicode/websheep"
            lang: "javascript"
          - name: "26-Vulnerable-OTP-App"
            repo: "mddanish/Vulnerable-OTP-Application"
            lang: "javascript"
          - name: "27-RailsGoat"
            repo: "OWASP/railsgoat"
            lang: "ruby"
          - name: "29-DVGA"
            repo: "dolevf/Damn-Vulnerable-GraphQL-Application"
            lang: "javascript"
          - name: "30-vAPI"
            repo: "roottusk/vapi"
            lang: "php"

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.repo }}
          path: target-repo
          fetch-depth: 1


      - name: Initialize CodeQL
        if: matrix.target.lang != 'php'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.target.lang }}
          queries: security-extended
          source-root: target-repo

      
      - name: CodeQL Autobuild
        if: matrix.target.lang == 'java' || matrix.target.lang == 'csharp'
        uses: github/codeql-action/autobuild@v3
        with:
          working-directory: target-repo


      - name: Perform CodeQL Analysis
        if: matrix.target.lang != 'php'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.target.lang }}"
          upload: false
          output: codeql-results-${{ matrix.target.name }}

      # --- КОНВЕРТАЦИЯ SARIF В ЧИСТЫЙ JSON ---
      - name: Convert CodeQL SARIF to JSON
        if: matrix.target.lang != 'php'
        run: |
          mkdir -p json-results-${{ matrix.target.name }}
          # Ищем сгенерированный SARIF файл
          SARIF_FILE=$(find codeql-results-${{ matrix.target.name }} -name "*.sarif" | head -n 1)
          
          if [ -n "$SARIF_FILE" ] && [ -f "$SARIF_FILE" ]; then
            # Извлекаем только массив уязвимостей (results)
            jq '[.runs[].results // []] | add' "$SARIF_FILE" > json-results-${{ matrix.target.name }}/codeql-findings.json
          else
            # Если файл пуст или не найден, создаем пустой JSON массив
            echo "[]" > json-results-${{ matrix.target.name }}/codeql-findings.json
          fi

      # --- SEMGREP SCAN ---
      - name: Run Semgrep
        run: |
          mkdir -p semgrep-results-${{ matrix.target.name }}
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --json \
            --output=/src/semgrep-results-${{ matrix.target.name }}/semgrep-report.json \
            /src/target-repo || true


      - name: Upload Individual Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-report-${{ matrix.target.name }}
          path: |
            json-results-${{ matrix.target.name }}/*.json
            semgrep-results-${{ matrix.target.name }}/*.json
          if-no-files-found: warn

  
  bundle-artifacts:
    name: Bundle All Reports
    needs: sast-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: sast-report-*
          merge-multiple: true

      - name: Compress to Single Archive
        run: |
          cd all-reports
          # Создаем один общий ZIP архив
          zip -r ../consolidated-sast-reports.zip .

      - name: Upload Consolidated Archive
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-sast-reports
          path: consolidated-sast-reports.zip
          retention-days: 14
